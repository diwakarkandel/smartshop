spring:
  application:
    name: smartshop-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartshop}
    username: ${DB_USERNAME:smartshop}
    password: ${DB_PASSWORD:smartshop123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
    access-token-expiration: ${APP_JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${APP_JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  supabase:
    storage-url: ${SUPABASE_STORAGE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
  esewa:
    enabled: ${ESEWA_ENABLED:false}
  khalti:
    enabled: ${KHALTI_ENABLED:false}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@smartshop.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@12345}
    admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Super}
    admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Admin}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.smartshop: INFO
    org.springframework.security: INFO