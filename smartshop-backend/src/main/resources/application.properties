# =========================================================
# APPLICATION
# =========================================================
spring.application.name=smartshop-backend


# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25


# =========================================================
# FLYWAY
# =========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# JSON
# =========================================================
spring.jackson.default-property-inclusion=non_null


# =========================================================
# SERVER
# =========================================================
server.port=${SERVER_PORT:8080}


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration=${APP_JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${APP_JWT_REFRESH_TOKEN_EXPIRATION:604800000}


# =========================================================
# CORS
# =========================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}


# =========================================================
# COOKIE
# =========================================================
# Set APP_COOKIE_SECURE=false in .env for local HTTP dev. Production should leave this as true.
app.cookie.secure=${APP_COOKIE_SECURE:true}
# Comma-separated IPs of trusted reverse proxies. Only these IPs may set X-Forwarded-For.
# Leave blank in dev (no proxy). In production: APP_TRUSTED_PROXIES=10.0.0.1
app.security.trusted-proxies=${APP_TRUSTED_PROXIES:}


# =========================================================
# SUPABASE STORAGE
# =========================================================
app.supabase.storage-url=${SUPABASE_STORAGE_URL}
app.supabase.service-key=${SUPABASE_SERVICE_KEY}
app.supabase.storage.public-url-base=${SUPABASE_PUBLIC_URL_BASE}


# =========================================================
# S3 STORAGE
# =========================================================
app.s3.endpoint=${S3_ENDPOINT}
app.s3.region=${S3_REGION:ap-southeast-1}
app.s3.access-key=${S3_ACCESS_KEY}
app.s3.secret-key=${S3_SECRET_KEY}
app.s3.bucket-name=${S3_BUCKET_NAME:smartshop}


# =========================================================
# PAYMENT
# =========================================================
app.esewa.enabled=${ESEWA_ENABLED:false}
app.khalti.enabled=${KHALTI_ENABLED:false}


# =========================================================
# ADMIN BOOTSTRAP
# =========================================================
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:true}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD}
app.bootstrap.admin-first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:Super}
app.bootstrap.admin-last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Admin}


# =========================================================
# SWAGGER / OPENAPI
# =========================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# =========================================================
# MAIL
# =========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:noreply@smartshop.local}
app.mail.from-name=${MAIL_FROM_NAME:SmartShop Platform}


# =========================================================
# LOGGING
# =========================================================
logging.level.com.smartshop=INFO
logging.level.com.smartshop.security=DEBUG

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=logs/smartshop.log

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.total-size-cap=100MB