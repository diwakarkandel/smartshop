services:
  db:
    image: postgres:16-alpine
    container_name: smartshop-db
    environment:
      POSTGRES_DB: smartshop
      POSTGRES_USER: smartshop
      POSTGRES_PASSWORD: smartshop123
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartshop -d smartshop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./smartshop-backend
    container_name: smartshop-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartshop
      DB_USERNAME: smartshop
      DB_PASSWORD: smartshop123
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47
      CORS_ALLOWED_ORIGINS: http://localhost
    ports:
      - "8080:8080"

  frontend:
    build: ./smartshop-frontend
    container_name: smartshop-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data: